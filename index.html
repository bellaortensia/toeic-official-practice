<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Official Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="wrap">
  <div class="sticky-top">
  <header class="app-header">
    <h1><a href="https://bellaortensia.github.io/toeic-official-practice/">TOEIC Official Practice</a></h1>

    <select class="sub-select" id="practiceSelect">
      <option value="">問題を選ぶ...</option>
      <optgroup label="TEST 1">
        <option value="T1-1">Part1 写真描写</option>
        <option value="T1-2">Part2 応答問題</option>
        <option value="T1-3">Part3 会話問題</option>
        <option value="T1-4">Part4 説明文問題</option>
        <option value="T1-5">Part5 短文穴埋め</option>
        <option value="T1-6">Part6 長文穴埋め</option>
        <option value="T1-7">Part7 読解問題</option>
      </optgroup>
      <optgroup label="TEST 2">
        <option value="T2-1">Part1 写真描写</option>
        <option value="T2-2">Part2 応答問題</option>
        <option value="T2-3">Part3 会話問題</option>
        <option value="T2-4">Part4 説明文問題</option>
        <option value="T2-5">Part5 短文穴埋め</option>
        <option value="T2-6">Part6 長文穴埋め</option>
        <option value="T2-7">Part7 読解問題</option>
      </optgroup>
    </select>　<details class="help" id="setupDetails">
      <summary>設定</summary>

      <details class="help sub-details" open>
        <summary>① Box連携</summary>
        <p id="status">確認中...</p>
        <button id="login-btn">Boxにログイン</button>
        <p id="result"></p>
      </details>

      <details class="help sub-details">
        <summary>② Gemini APIキー(解説生成用・任意)</summary>
        <div class="setup-fields">
          <div class="field">
            <label for="geminiKey">GEMINI API KEY(無料)</label>
            <input id="geminiKey" type="password" placeholder="AIza...">
          </div>
        </div>
        <p class="hint">未入力でも問題演習はできますが、AIによる解説は表示されません。<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>で無料取得できます。decode-toeicと同じキーを使っている場合は自動で反映されます。</p>
      </details>
    </details>
  </header>
  </div>

  <main>
    <section id="practice" class="panel" style="display:none;">
      <div class="practice-header">
        <span id="progress-label"></span>
      </div>
      <div id="practice-body"></div>
      <div class="practice-footer">
        <button id="prev-btn">← 前へ</button>
        <button id="next-btn">次へ →</button>
      </div>
    </section>

    <section id="empty-state" class="panel">
      <p>上のBox連携でログインしてから、右上のプルダウンでテスト・Partを選んでください。</p>
    </section>
  </main>
</div>

  <script src="script.js?v=11"></script>
</body>
</html>
