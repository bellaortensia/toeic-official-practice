<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Official Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="wrap">
  <div class="sticky-top">
  <header class="app-header">
    <h1><a href="https://bellaortensia.github.io/toeic-official-practice/">TOEIC Official Practice</a></h1>

    <select class="sub-select" id="appModeSelect">
      <option value="normal">chunked literal translation / 英語を前から訳して英語脳を鍛える</option>
      <option value="goldenPhrases">出る単特急　金のフレーズ</option>
      <option value="vocabNotes">単語・熟語メモ</option>
      <option value="toeicOfficial" selected>TOEIC Official Practice</option>
    </select>　<details class="help" id="setupDetails">
      <summary>Initial Setup (Box connection, API key)</summary>

      <details class="help sub-details" open>
        <summary>① Box連携</summary>
        <p id="status">確認中...</p>
        <button id="login-btn">Boxにログイン</button>
        <p id="result"></p>
      </details>

      <details class="help sub-details">
        <summary>② Gemini APIキー(解説生成用・任意)</summary>
        <div class="setup-fields">
          <div class="field">
            <label for="geminiKey">GEMINI API KEY(無料)</label>
            <input id="geminiKey" type="password" placeholder="AIza...">
          </div>
        </div>
        <p class="hint">未入力でも問題演習はできますが、AIによる解説は表示されません。<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>で無料取得できます。decode-toeicと同じキーを使っている場合は自動で反映されます。</p>
      </details>
    </details>
  </header>
  </div>

  <main>
    <section id="practice" class="panel" style="display:none;">
      <div class="practice-header">
        <button id="header-prev-btn" class="nav-btn"><span class="nav-arrow">◀</span><span class="nav-text">前の問題</span></button>
        <span id="progress-label"></span>
        <button id="header-next-btn" class="nav-btn"><span class="nav-text">次の問題</span><span class="nav-arrow">▶</span></button>
      </div>
      <div id="practice-body"></div>
    </section>

    <section id="empty-state" class="panel">
      <p>下のリストからテスト・Part・問題を選んで学習を始めてください。音声の再生には、上の「設定」からBox連携でログインしてください。</p>
      <div class="landing-nav" id="landingNav"></div>
    </section>
  </main>
</div>

  <script src="script.js?v=16"></script>
</body>
</html>
